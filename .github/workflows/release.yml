name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS Release (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Universal App Bundle
        run: |
          chmod +x palikey-macos/build.sh
          ./palikey-macos/build.sh

      - name: Package macOS Universal Bundle
        run: |
          ditto -c -k --keepParent palikey-macos/build/PaliKey.app PaliKeyboard-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaliKeyboard-macOS
          path: PaliKeyboard-macOS.zip

      - name: Attach macOS Asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PaliKeyboard-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows Release (TSF DLL + Hook)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build palikey-engine staticlib (x64 MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path palikey-engine/Cargo.toml
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build palikey-windows hook executable (x64 MSVC)
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path palikey-windows/Cargo.toml
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Configure and build PaliKeyTSF.dll (CMake / MSVC x64)
        run: |
          cmake -B palikey-tsf/build -S palikey-tsf -A x64
          cmake --build palikey-tsf/build --config Release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item palikey-tsf/build/Release/PaliKeyTSF.dll dist-windows/
          Copy-Item palikey-tsf/register.bat dist-windows/
          Copy-Item palikey-tsf/unregister.bat dist-windows/
          Copy-Item palikey-windows/INSTALL.txt dist-windows/INSTALL.txt

          if (Test-Path palikey-windows/target/x86_64-pc-windows-msvc/release/palikey-windows.exe) {
              Copy-Item palikey-windows/target/x86_64-pc-windows-msvc/release/palikey-windows.exe dist-windows/
          } elseif (Test-Path palikey-windows/target/release/palikey-windows.exe) {
              Copy-Item palikey-windows/target/release/palikey-windows.exe dist-windows/
          } elseif (Test-Path target/x86_64-pc-windows-msvc/release/palikey-windows.exe) {
              Copy-Item target/x86_64-pc-windows-msvc/release/palikey-windows.exe dist-windows/
          } else {
              Copy-Item target/release/palikey-windows.exe dist-windows/
          }

          Compress-Archive -Path dist-windows/* -DestinationPath PaliKeyboard-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaliKeyboard-Windows
          path: PaliKeyboard-Windows.zip

      - name: Attach Windows Asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PaliKeyboard-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
