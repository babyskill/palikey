<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle inner keycap plate -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="#7C2D12" fill-opacity="0.35" />

  <!-- Macron accent bar -->
  <rect x="42" y="30" width="44" height="8" rx="4" fill="#FEF3C7" />

  <!-- Pāḷi letter 'a' with macron above forming 'ā' -->
  <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', serif" font-size="64" font-weight="700" fill="#FFFBEB" text-anchor="middle">a</text>

  <!-- Small lotus/wheel dot motif at lower right -->
  <circle cx="98" cy="98" r="4" fill="#FDE68A" />
</svg>
